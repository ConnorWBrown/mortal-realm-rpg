<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Mortal Realm</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #3e2731;
        overflow: hidden;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: #e8d8b0;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        overscroll-behavior: none;
      }
      #game-root {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      #canvas-wrap {
        position: relative;
        display: inline-block;
        line-height: 0;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
        max-width: 100%;
        max-height: 100%;
      }
      #now-box {
        position: absolute;
        top: 1.5%;
        left: 1.5%;
        background: rgba(26, 20, 32, 0.9);
        border: 1px solid #c8a060;
        box-shadow: inset 0 0 0 1px #6b4a3a;
        padding: 3px 6px;
        display: flex;
        gap: 6px;
        align-items: center;
        font: 11px ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: #e8d8b0;
        line-height: 1.2;
        max-width: 42%;
      }
      #now-box .now-label {
        color: #ffef99;
        font-weight: bold;
        letter-spacing: 0.5px;
      }
      #now-box input {
        background: transparent;
        border: 0;
        padding: 0;
        margin: 0;
        color: inherit;
        font: inherit;
        width: 120px;
        outline: none;
        caret-color: #e8d8b0;
      }
      #now-box input::placeholder {
        color: #8a7a5a;
      }
      #now-box:focus-within {
        border-color: #ffef99;
      }
      #touch-controls {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: none;
      }
      /* Touch controls only visible on coarse pointers */
      @media (pointer: coarse) {
        #touch-controls { display: block; }
      }
      .touch-dpad, .touch-buttons {
        position: absolute;
        bottom: max(24px, env(safe-area-inset-bottom));
        pointer-events: auto;
        display: grid;
      }
      .touch-dpad {
        left: 24px;
        grid-template-columns: repeat(3, 56px);
        grid-template-rows: repeat(3, 56px);
        gap: 4px;
      }
      .touch-buttons {
        right: 24px;
        grid-template-columns: repeat(2, 64px);
        gap: 12px;
      }
      .tbtn {
        background: rgba(232, 216, 176, 0.15);
        border: 2px solid rgba(232, 216, 176, 0.5);
        color: #e8d8b0;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
        display: grid;
        place-items: center;
      }
      .tbtn:active { background: rgba(232, 216, 176, 0.35); }
      .dpad-up    { grid-column: 2; grid-row: 1; }
      .dpad-left  { grid-column: 1; grid-row: 2; }
      .dpad-right { grid-column: 3; grid-row: 2; }
      .dpad-down  { grid-column: 2; grid-row: 3; }
      .btn-a { height: 64px; }
      .btn-b { height: 64px; }
    </style>
  </head>
  <body>
    <div id="game-root">
      <div id="canvas-wrap">
        <canvas id="game" width="320" height="240"></canvas>
        <form id="now-box" autocomplete="off" onsubmit="return false">
          <span class="now-label">Now</span>
          <input id="now-input" type="text" maxlength="60" placeholder="what are you doing?" />
        </form>
      </div>
    </div>
    <div id="touch-controls" aria-hidden="true">
      <div class="touch-dpad">
        <button class="tbtn dpad-up"    data-input="up">▲</button>
        <button class="tbtn dpad-left"  data-input="left">◀</button>
        <button class="tbtn dpad-right" data-input="right">▶</button>
        <button class="tbtn dpad-down"  data-input="down">▼</button>
      </div>
      <div class="touch-buttons">
        <button class="tbtn btn-b" data-input="b">B</button>
        <button class="tbtn btn-a" data-input="a">A</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
